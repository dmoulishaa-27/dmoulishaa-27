<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b1035"/><stop offset="0.55" stop-color="#4a2a6e"/><stop offset="1" stop-color="#c9577f"/>
  </linearGradient>
  <radialGradient id="moon" cx="0.4" cy="0.4" r="0.7">
    <stop offset="0" stop-color="#fff7e0"/><stop offset="1" stop-color="#ffd6e8"/>
  </radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="petal" d="M0,0 C6,-9 15,-5 11,4 C8,10 2,9 0,0 Z" fill="#ffc8dd" opacity="0.9"/>
  <clipPath id="typeclip"><rect x="60" y="150" width="0" height="40">
    <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect></clipPath>
</defs>
<style>
  .tw { animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
  .fall { animation: fall 9s linear infinite; }
  @keyframes fall {
    0%   { transform: translate(0,0) rotate(0deg); opacity:0 }
    10%  { opacity:1 }
    50%  { transform: translate(-60px,170px) rotate(200deg) }
    90%  { opacity:1 }
    100% { transform: translate(-120px,340px) rotate(420deg); opacity:0 }
  }
  .bob { animation: bob 3.5s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translate(730px,140px) } 50% { transform: translate(730px,130px) } }
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
  .swayL { transform-origin: -48px -20px; animation: swayL 3s ease-in-out infinite; }
  .swayR { transform-origin: 48px -20px; animation: swayR 3s ease-in-out infinite; }
  @keyframes swayL { 0%,100% { transform: rotate(3deg) } 50% { transform: rotate(-4deg) } }
  @keyframes swayR { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(4deg) } }
  .moonpulse { animation: mp 5s ease-in-out infinite; }
  @keyframes mp { 0%,100% { opacity:.85 } 50% { opacity:1 } }
  .sub { animation: fadeIn 3s ease-in 0.5s both; }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
</style>

